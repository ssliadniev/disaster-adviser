services:
  db:
    image: postgres:15-alpine
    container_name: disaster_db
    environment:
      POSTGRES_USER: disaster_user
      POSTGRES_PASSWORD: disaster_pass
      POSTGRES_DB: disaster_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disaster_user -d disaster_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: disaster_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://disaster_user:disaster_pass@db:5432/disaster_db
      SECRET_KEY: your-secret-key-change-in-production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
